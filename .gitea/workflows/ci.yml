name: CI
'on':
  pull_request: {}
  push:
    branches:
    - main
permissions:
  contents: read
jobs:
  verify:
    name: Backend quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-go@v6
      with:
        go-version: 1.27.3
        cache: false
    - name: Verify backend modules and vet
      shell: bash
      run: |-
        go mod verify
        go vet ./...
      working-directory: backend
    - name: Test backend
      shell: bash
      run: go test -count=1 ./...
      working-directory: backend
    - name: Build backend
      shell: bash
      run: go build ./...
      working-directory: backend
